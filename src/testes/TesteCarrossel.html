<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel</title>
    <style>
       body{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: center;
       }
       #img{
        width:500px;
        height:25vw;
        max-height: 150px;

        position: relative;
       }
       #img img{
        opacity: 0;
        position: absolute;
        height: 100%;
        width: 100%;
        object-fit: cover;
       }
       #img img.visible{
        opacity: 1;
       }
    </style>
</head>
<body id="corpo">
    <header>
        <section class="Boas-vindas" id="BoasVindas">
            <h2>Boas vindas</h2>
            <button id="entrar">ENTRAR</button>
        </section>
    </header>
    <div class="carrossel">
        <div class="container" id="img">
                <img class="visible" src="https://images2.alphacoders.com/784/thumb-1920-784000.jpg">
                <img src="https://levelingupyourgame.com/wp-content/uploads/2020/06/The-Last-of-Us-2-Review-Graphics-Scenery-and-Visuals-3-1024x427.jpg">
                <img src="https://c4.wallpaperflare.com/wallpaper/739/954/443/the-last-of-us-2-video-games-playstation-4-artwork-post-apocalypse-hd-wallpaper-preview.jpg">
        </div>
    </div>

    <script src="../js/estrutura.js">
        
    </script>
</body>
</html>
